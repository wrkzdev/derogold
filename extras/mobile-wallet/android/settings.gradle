pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    // 8.11.1 is Flutter's floor, the same chain as the Gradle version in
    // gradle/wrapper/gradle-wrapper.properties: the desktop and web wallets
    // ask for Dart ^3.10.7, which pins Flutter 3.47.4, which requires
    // Gradle >= 8.14 and AGP >= 8.11.1. AGP 8.11 wants Gradle 8.13 or newer,
    // which 8.14 satisfies.
    //
    // Deliberately not AGP 9: from 9 only the new DSL is read, and the
    // Flutter Gradle plugin applied in app/build.gradle fails against it.
    id "com.android.application" version "8.11.1" apply false
    id "org.jetbrains.kotlin.android" version "2.1.0" apply false
}

include ":app"
