distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
#
# 8.14 is Flutter's floor, not a preference:
#
#   Your project's Gradle version (8.12.1) is lower than Flutter's minimum
#   supported version of 8.14.0.
#
# The Flutter this is built with is itself pinned by the Dart SDK the desktop
# and web wallets ask for (sdk: ^3.10.7), so the chain runs
# pubspec -> Flutter 3.47.4 -> Gradle 8.14. AGP 8.9.2 in settings.gradle
# supports Gradle 8.11.1 and newer, so it is unaffected.
distributionUrl=https\://services.gradle.org/distributions/gradle-8.14-all.zip
